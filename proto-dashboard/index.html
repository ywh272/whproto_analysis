<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로토 승부식 분석 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="lock" class="lock">
  <form id="lockForm" class="lockbox" autocomplete="off">
    <span class="logo" aria-hidden="true">P</span>
    <h1>프로토 승부식 분석</h1>
    <p class="sub">비밀번호를 입력하세요</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="20" autofocus aria-label="비밀번호">
    <button class="primary" type="submit">들어가기</button>
    <p id="pwErr" class="err" hidden>비밀번호가 맞지 않습니다</p>
  </form>
</div>
<div id="app" hidden>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">P</span>
    <div>
      <h1>프로토 승부식 분석</h1>
      <p class="sub" id="dbSummary">데이터를 불러오는 중…</p>
    </div>
  </div>
  <button class="ghost" id="themeBtn" title="라이트/다크 전환">🌓</button>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="upload" class="on">📂 업로드·데이터</button>
  <button role="tab" data-tab="predict">🎯 예측 분석</button>
  <button role="tab" data-tab="flow">📈 배당 흐름</button>
  <button role="tab" data-tab="team">👥 팀별</button>
  <button role="tab" data-tab="league">🏆 종목·리그별</button>
  <button role="tab" data-tab="h2h">⚔️ 상대전적</button>
</nav>

<section class="filters" id="filters" hidden>
  <label>종목 <select id="fSport"></select></label>
  <label>리그 <select id="fLeague"></select></label>
  <label>유형 <select id="fKind"></select></label>
  <label>구간 <select id="fHalf"><option value="full">풀타임</option><option value="half">전반</option><option value="all">전체</option></select></label>
  <label>회차 <input id="fFrom" type="number" placeholder="부터" min="1"> ~ <input id="fTo" type="number" placeholder="까지" min="1"></label>
  <button class="ghost" id="fReset">초기화</button>
</section>

<main id="view"></main>

<footer class="foot">
  모든 파일은 이 브라우저 안에서만 처리·저장됩니다 (서버 전송 없음). 점수는 과거 데이터 기준 경향일 뿐 결과를 보장하지 않습니다.
</footer>

</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
